	server_name ~^(?<user>[^.]+)\.envs\.net;

	include snippets/ssl.conf;
	include ssl/envs_net_wild.conf;
	include snippets/local_ssl_header.conf;

	error_log /var/log/nginx/envs.net-error.log crit;

	##
	## Sensitive files / VCS metadata
	##

	# Never expose version-control metadata.
	location ~ (^|/)\.(?:git|hg|svn)(?:/|$) {
		return 404;
	}

	# Never expose environment files.
	location ~ (^|/)\.env(?:\.[^/]*)?$ {
		return 404;
	}

	# Apache-style credential/config files.
	location ~ (^|/)\.(?:htaccess|htpasswd)$ {
		return 404;
	}

	# Prevent exposure of private-key files.
	include snippets/envs-private-key-deny.conf;

	include snippets/user.envs.conf;
}
