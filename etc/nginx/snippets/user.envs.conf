# Protect /restricted/ regardless of the selected location.
auth_basic $envs_restricted_realm;
auth_basic_user_file /home/$user/.htpasswd;

root /home/$user/public_html;
index index.html index.php index.cgi index.py index.sh index.pl index.lua;

location ~ \.php$ {
    if ($envs_php_backend = "unix:/run/php/php8.4-fpm.sock") {
        return 403;
    }
    include snippets/php_common;
}
include fastcgi_params;
ssi on;

include snippets/error_pages;

autoindex on;
autoindex_exact_size off;
#fancyindex on;
#fancyindex_exact_size off;

location / {
	try_files $uri $uri.html $uri/ @extensionless-php;
}
location @extensionless-php {
	rewrite ^(.*)$ $1.php last;
}

location ~ (\.cgi|\.py|\.sh|\.pl|\.lua|\/cgi-bin)$ {
    gzip off;

    include fastcgi_params;

    fastcgi_pass $envs_cgi_backend;

    if ($envs_cgi_backend = "unix:/run/fcgiwrap.socket") {
        return 403;
    }
}

#if (!-d /home/$user/public_html) {
#	return 307 https://envs.net/;
#}

#if (!-f /home/$user/.weechat/relay_socket) {
#    return 404;
#}

location /weechat {
	proxy_pass http://unix:/home/$user/.weechat/relay_socket:/weechat;
	include proxy_params;

	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "Upgrade";

	limit_req zone=weechat burst=1 nodelay;   # Brute force prevention
}
